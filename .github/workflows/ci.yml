name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: gofmt
        run: |
          unformatted=$(gofmt -l . | grep -v '^\.cache/' || true)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      - name: race
        run: go test -race ./internal/...
      - name: fuzz (bounded)
        run: go test ./internal/record/ -run '^$' -fuzz=FuzzDecodeFrame -fuzztime=15s

  mount-court:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: build
        run: CGO_ENABLED=0 go build -o /tmp/orfs ./cmd/orfs
      - name: enable fuse
        run: sudo modprobe fuse || true
      - name: mounted POSIX court
        run: sudo FUSE_ALLOW=1 sh scripts/mount-court.sh /tmp/orfs
